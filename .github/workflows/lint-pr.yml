name: Lint PR

on:
  pull_request:
    types:
      - opened
      - edited
      - reopened
      - synchronize

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint-pr:
    name: Validate PR title against Conventional Commits
    runs-on: hanzo-build-linux-amd64
    permissions:
      contents: read
      pull-requests: read
    steps:
      # Inlined from PostHog/.github semantic-pr-title.yml so the check runs on the
      # self-hosted ARC pool instead of GitHub-hosted ubuntu-latest (which the org
      # is billing-blocked from). Same action, same pin.
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
