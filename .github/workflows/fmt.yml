name: Check Formatting

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - main
  merge_group:

jobs:
  fmt:
    name: Check formatting
    runs-on: hanzo-build-linux-amd64
    steps:
      # go-version-file, not a pinned 1.21: go.mod requires go >= 1.26.4 and the
      # job image ships 1.21.13 with GOTOOLCHAIN=local, so the build refused
      # before compiling anything:
      #   go: go.mod requires go >= 1.26.4 (running go 1.21.13; GOTOOLCHAIN=local)
      # Reading the version from go.mod means the two cannot drift apart again.
      - name: Set up Go (from go.mod)
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      - name: Check out source code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Check formatting
        run: |
          go fmt ./...
          git diff --exit-code || (echo "Files are not formatted. Run \`go fmt ./...\` locally and commit the changes." && exit 1)
